name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract AI Studio project
        run: |
          mkdir project
          unzip -q *.zip -d project

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: project/package-lock.json

      - name: Install dependencies
        working-directory: project
        run: npm install

      - name: Build web app
        working-directory: project
        run: npm run build

      - name: Install Capacitor
        working-directory: project
        run: npm install @capacitor/core @capacitor/android

      - name: Create Capacitor configuration
        working-directory: project
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.mahaagri.kranti',
            appName: 'Maha Agri Kranti',
            webDir: 'dist',
          };

          export default config;
          EOF

      - name: Install Capacitor CLI
        working-directory: project
        run: npm install -D @capacitor/cli

      - name: Add Android platform
        working-directory: project
        run: npx cap add android

      - name: Copy web app into Android project
        working-directory: project
        run: npx cap copy android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: project/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maha-Agri-Kranti-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
