name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o maha-agri-kranti-android-ready.zip -x ".github/workflows/build-apk.yml"
          rm -f maha-agri-kranti-android-ready.zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Copy web app into Android
        run: |
          rm -rf app/src/main/assets/web
          mkdir -p app/src/main/assets/web
          cp -R dist/. app/src/main/assets/web/

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maha-Agri-Kranti-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
